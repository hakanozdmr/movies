# Test Configuration for Google OAuth
# This file contains test values for Google OAuth integration

# Database Configuration (Test)
spring.data.mongodb.database=moviesdb_test
spring.data.mongodb.uri=mongodb://localhost:27017/moviesdb_test

# Server Configuration (Test)
server.servlet.context-path=/api/v1
server.port=8080

# Google OAuth Configuration (TEST MODE)
# IMPORTANT: Replace with your actual Google Client ID from Google Cloud Console
# Steps to get real Client ID:
# 1. Go to https://console.developers.google.com/
# 2. Create a new project or select existing project
# 3. Enable Google+ API
# 4. Go to Credentials > Create Credentials > OAuth 2.0 Client IDs
# 5. Set Application type to "Web application"
# 6. Add Authorized JavaScript origins: http://localhost:3000
# 7. Copy the Client ID and replace the test value below

google.client.id=${env.GOOGLE_CLIENT_ID}
google.client.secret=${env.GOOGLE_CLIENT_SECRET}

# Logging for debugging
logging.level.dev.hakan.movies.business.service.GoogleAuthService=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
