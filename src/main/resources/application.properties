spring.data.mongodb.database=${env.MONGO_DATABASE}
spring.data.mongodb.uri=mongodb+srv://${env.MONGO_USER}:${env.MONGO_PASSWORD}@${env.MONGO_CLUSTER}
server.servlet.context-path=/api/v1
server.port=8080
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Google OAuth Configuration
# Test configuration - Replace with your actual Google Client ID
# Get your Client ID from: https://console.developers.google.com/
google.client.id=${env.GOOGLE_CLIENT_ID}
google.client.secret=${env.GOOGLE_CLIENT_SECRET}

